name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: taskapp
          POSTGRES_DB: taskapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskapp -d taskapp"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://taskapp:taskapp@localhost:5432/taskapp
      TEST_DATABASE_URL: postgresql://taskapp:taskapp@localhost:5432/taskapp_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build

  e2e:
    name: End-to-end (Playwright against docker compose)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - if: failure()
        run: docker compose logs --no-color api migrate web | tail -200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - if: always()
        run: docker compose down -v
