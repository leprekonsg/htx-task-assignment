# Serves the built SPA and forwards API + Swagger traffic to the api service (single origin, no CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;   # skill inference can take a few seconds
  }

  location /docs {
    proxy_pass http://api:3000/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Hashed build assets are immutable; index.html must never be cached so deploys take effect.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Self-hosted Work Sans. Unlike /assets/ these filenames aren't content-hashed (Vite copies
  # public/ through verbatim), so the long cache is safe only because the file never changes in
  # place — a new cut of the font would ship under a new filename. Not gzipped: woff2 is already
  # compressed, so re-compressing it only burns CPU.
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri /index.html;
  }
}
