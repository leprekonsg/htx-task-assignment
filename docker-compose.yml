# docker compose up --build  →  http://localhost:8080  (API docs at http://localhost:8080/docs)
# Copy .env.example to .env first; GEMINI_API_KEY is optional.
# `migrate` and `api` are the same image doing two jobs: the one-shot database command and the
# server. Both carry the build, so `docker compose build api` and `docker compose build migrate`
# mean the same thing — a service you can run by name should be a service you can build by name.
x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: htx-task-assignment/api

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskapp}
      POSTGRES_DB: ${POSTGRES_DB:-taskapp}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies pending migrations and the seed, then exits. `api` waits for it to succeed.
  migrate:
    <<: *api-image
    command: ['node', 'dist/db/cli.js', 'migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskapp}:${POSTGRES_PASSWORD:-taskapp}@db:5432/${POSTGRES_DB:-taskapp}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api-image
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskapp}:${POSTGRES_PASSWORD:-taskapp}@db:5432/${POSTGRES_DB:-taskapp}
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-gemma-4-31b-it,gemma-4-26b-a4b-it}
      # Pass-throughs: set in `.env` (or the shell) to override; an unset key is left out of the
      # container, so the API's own default (apps/api/src/config.ts) applies.
      LOG_LEVEL:
      LLM_TIMEOUT_MS:
      LLM_ATTEMPT_TIMEOUT_MS:
      LLM_PRIMARY_ATTEMPTS:
      LLM_RATE_LIMIT_COOLDOWN_MS:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
