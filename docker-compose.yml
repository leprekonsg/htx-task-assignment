# docker compose up --build  →  http://localhost:8080  (API docs at http://localhost:8080/docs)
# Copy .env.example to .env first; GEMINI_API_KEY is optional.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskapp}
      POSTGRES_DB: ${POSTGRES_DB:-taskapp}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies pending migrations and the seed, then exits. `api` waits for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: htx-task-assignment/api
    command: ['node', 'dist/db/cli.js', 'migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskapp}:${POSTGRES_PASSWORD:-taskapp}@db:5432/${POSTGRES_DB:-taskapp}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: htx-task-assignment/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskapp}:${POSTGRES_PASSWORD:-taskapp}@db:5432/${POSTGRES_DB:-taskapp}
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-gemma-4-31b-it,gemma-4-26b-a4b-it}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
